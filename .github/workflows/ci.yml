# Nonna CI — the harness held to its own bar. Four deterministic gates:
# shellcheck (every script), harness-lint (the harness validates itself), the
# gate golden tests (proof each gate blocks vs. allows; run again on a stock Mac,
# and under Git Bash on Windows, where it only reports), and the plugin manifests
# as Claude Code itself reads them.
# Every third-party action is pinned to a full commit SHA with its tag beside it: a
# tag can be moved after the fact, a SHA cannot. Bump the two together.
# Adopters: add your own lint/type/test gate as another job — see stacks/.
name: Nonna CI

on:
  push:
  pull_request:

# Read-only by default; a job that needs more asks for it itself.
permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run shellcheck on all scripts (follow sourced libs)
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        env:
          SHELLCHECK_OPTS: -x

  harness-lint:
    name: harness-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Validate the harness against its own rules
        run: python3 tests/harness_lint.py

  gates:
    name: gate self-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run the gate golden tests
        run: bash tests/run.sh

  # The same suite on what a Mac ships: /bin/bash 3.2 and Apple's awk, sed and grep, no
  # Homebrew. The guards parse shell in bash and awk, and those differ from Linux's in ways
  # that only this job can see.
  gates-macos:
    name: gate self-tests (macOS, stock bash 3.2)
    runs-on: macos-latest
    # Linux takes a few minutes; this only stops a hang from running for GitHub's 6 hours.
    timeout-minutes: 30
    env:
      STOCK_PATH: /usr/bin:/bin:/usr/sbin:/sbin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # A green run under some other bash proves nothing, so fail if the runner is not what
      # the name says. The versions it prints are the evidence of what ran.
      - name: Check the toolchain is a stock Mac's
        run: |
          env PATH="$STOCK_PATH" /bin/bash -e <<'EOF'
          echo "bash $BASH_VERSION"
          case "$BASH_VERSION" in 3.2.*) ;; *) echo "::error::/bin/bash is $BASH_VERSION, not 3.2"; exit 1 ;; esac
          for t in awk sed grep python3 jq git; do
            command -v "$t" || { echo "::error::$t is not on a stock Mac path"; exit 1; }
          done
          python3 --version; jq --version; git --version
          EOF
      - name: Run the gate golden tests
        run: env PATH="$STOCK_PATH" /bin/bash tests/run.sh

  # The same suite under Git Bash on Windows, the shell Claude Code runs the hooks in there. Windows
  # differs where the hooks lean on Linux: `ln -s` makes a copy, not a link; Git for Windows checks
  # files out with CRLF, and a native jq.exe writes CRLF; a path can start with `C:` and arrive with
  # backslashes; `timeout` can be Windows' own. This job reports and does not block
  # (continue-on-error) until what it finds is fixed (#30); its log is what docs/INSTALL.md's Windows
  # section is written from. Each leg changes one thing from the one before, so a failure names its
  # cause.
  gates-windows:
    name: gate self-tests (Windows, Git Bash, ${{ matrix.leg }})
    runs-on: windows-latest
    continue-on-error: true
    # MSYS2 forks slowly and this suite forks a great deal; this only stops a hang from running for
    # GitHub's 6 hours.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # As a Windows developer has it out of the box: Git for Windows' installer sets
          # core.autocrlf=true, `ln -s` copies, and the runner has a native jq.exe.
          - leg: CRLF checkout
            autocrlf: "true"
            msys: ""
            jq: present
            powershell: true
          # The same with the line endings out of the way: what still fails is not about CRLF.
          - leg: LF checkout
            autocrlf: "false"
            msys: ""
            jq: present
          # Without jq, as on a machine that has only Git for Windows: the gates read JSON in awk.
          - leg: LF checkout, no jq
            autocrlf: "false"
            msys: ""
            jq: absent
          # And with native symlinks, which Developer Mode and MSYS=winsymlinks:nativestrict give.
          - leg: LF checkout, no jq, native symlinks
            autocrlf: "false"
            msys: winsymlinks:nativestrict
            jq: absent
    defaults:
      run:
        shell: bash
    steps:
      # Before the checkout, which is where git applies it.
      - name: Set how git checks files out
        env:
          AUTOCRLF: ${{ matrix.autocrlf }}
          MSYS_MODE: ${{ matrix.msys }}
        run: |
          git config --global core.autocrlf "$AUTOCRLF"
          echo "core.autocrlf=$(git config --get core.autocrlf)"
          if [ -n "$MSYS_MODE" ]; then echo "MSYS=$MSYS_MODE" >> "$GITHUB_ENV"; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The runner's jq is a native jq.exe from Chocolatey; Git for Windows brings none. If it cannot be
      # taken away the leg still runs, with jq, and says so.
      - name: Take jq away
        if: ${{ matrix.jq == 'absent' }}
        continue-on-error: true
        run: |
          for _ in 1 2 3 4 5; do
            p="$(command -v jq)" || break
            echo "taking $p away"
            mv "$p" "$p.away" 2>/dev/null || rm -f "$p" "$p.exe" || true
          done
          if command -v jq; then echo "::error::jq is still on PATH"; exit 1; fi
          echo "jq is gone"
      # A green run under some other bash proves nothing, so fail if this is not Git Bash. The versions it
      # prints are the evidence of what ran.
      - name: Check the toolchain is Git Bash's
        run: |
          echo "bash $BASH_VERSION"
          uname -srm
          case "$(uname -s)" in MINGW* | MSYS*) ;; *) echo "::error::this shell is $(uname -s), not Git Bash"; exit 1 ;; esac
          git --version
          for t in awk sed grep; do
            command -v "$t" >/dev/null || { echo "::error::$t is not on PATH"; exit 1; }
          done
          first() { local v; v="$("$@" 2>&1)"; printf '%s\n' "${v%%$'\n'*}"; }
          first awk --version; first sed --version; first grep --version
          # The suite's own helpers call jq and python3, which Git for Windows does not bring: say so.
          if command -v jq >/dev/null; then jq --version; else echo "::warning::no jq on PATH"; fi
          if python3 -c 'pass' >/dev/null 2>&1; then
            python3 --version
          else
            echo "::warning::python3 does not run here; the suite gets a shim that calls python"
            mkdir -p "$RUNNER_TEMP/shim"
            printf '#!/bin/sh\nexec python "$@"\n' > "$RUNNER_TEMP/shim/python3"
            chmod +x "$RUNNER_TEMP/shim/python3"
            echo "$RUNNER_TEMP/shim" >> "$GITHUB_PATH"
          fi
      # Facts, not verdicts (tests/windows-probe.sh): what this shell does to the hooks. Not on the CRLF
      # leg, where the probe is CRLF too and cannot run; the suite's first error shows the same thing.
      - name: Probe what Windows does to the hooks
        if: ${{ matrix.autocrlf == 'false' }}
        continue-on-error: true
        run: bash tests/windows-probe.sh
      # Where Git for Windows is absent, or Claude Code cannot find it, PowerShell runs a hook command.
      # hooks.json holds bash, so the question is what PowerShell makes of it.
      - name: Probe what PowerShell does to a hook command
        if: ${{ matrix.powershell }}
        continue-on-error: true
        shell: pwsh
        run: |
          $root = (Resolve-Path .claude).Path -replace '\\', '/'
          $hook = '"' + $root + '"/hooks/guard-branch.sh'
          "probe hook command as PowerShell gets it: $hook"
          $enc = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($hook))
          foreach ($exe in 'pwsh', 'powershell') {
            $found = Get-Command $exe -ErrorAction SilentlyContinue
            if (-not $found) { "probe ${exe}: not found"; continue }
            $v = (& $found.Source -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion.ToString()' | Out-String).Trim()
            $out = (& $found.Source -NoProfile -NonInteractive -EncodedCommand $enc 2>&1 | Out-String) -replace ([char]27 + '\[[0-9;]*m'), ''
            $code = $LASTEXITCODE
            "probe $exe $v runs it: exit $code | " + (($out -split "`r?`n" | Where-Object { $_.Trim() } | Select-Object -First 6) -join ' / ')
          }
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -and $_ -notmatch '\\Git\\' }) -join ';'
          foreach ($tool in 'bash', 'git') {
            "probe $tool on PATH without Git for Windows: " + ((Get-Command $tool -All -ErrorAction SilentlyContinue | ForEach-Object Source) -join '; ')
          }
      - name: Run the gate golden tests
        run: |
          set +e
          bash tests/run.sh 2>&1 | tee "$RUNNER_TEMP/suite.log"
          rc=${PIPESTATUS[0]}
          echo
          echo "=== failed checks, by section ==="
          awk '/^== /{ s = $0 } /^  FAIL /{ print s " :: " $0 }' "$RUNNER_TEMP/suite.log"
          echo "=== tests/run.sh exited $rc ==="
          exit "$rc"

  plugin-validate:
    name: plugin manifest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DISABLE_AUTOUPDATER: "1"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      # The npm postinstall below runs third-party code; keep the token out of .git/config.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      # Pinned: the validator's rules change between releases, and CI must not drift under us.
      # `plugin validate` reads files only; it needs no login and no secret.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.282
      - name: Validate the marketplace and the plugin (a warning fails the job)
        run: |
          claude plugin validate --strict .
          claude plugin validate --strict ./.claude
