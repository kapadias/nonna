# Nonna CI — the harness held to its own bar. Four deterministic gates:
# shellcheck (every script), harness-lint (the harness validates itself), the
# gate golden tests (proof each gate blocks vs. allows; run again on a stock Mac),
# and the plugin manifests as Claude Code itself reads them.
# Every third-party action is pinned to a full commit SHA with its tag beside it: a
# tag can be moved after the fact, a SHA cannot. Bump the two together.
# Adopters: add your own lint/type/test gate as another job — see stacks/.
name: Nonna CI

on:
  push:
  pull_request:

# Read-only by default; a job that needs more asks for it itself.
permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run shellcheck on all scripts (follow sourced libs)
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        env:
          SHELLCHECK_OPTS: -x

  harness-lint:
    name: harness-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Validate the harness against its own rules
        run: python3 tests/harness_lint.py

  gates:
    name: gate self-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run the gate golden tests
        run: bash tests/run.sh

  # The same suite on what a Mac ships: /bin/bash 3.2 and Apple's awk, sed and grep, no
  # Homebrew. The guards parse shell in bash and awk, and those differ from Linux's in ways
  # that only this job can see.
  gates-macos:
    name: gate self-tests (macOS, stock bash 3.2)
    runs-on: macos-latest
    # Linux takes a few minutes; this only stops a hang from running for GitHub's 6 hours.
    timeout-minutes: 30
    env:
      STOCK_PATH: /usr/bin:/bin:/usr/sbin:/sbin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # A green run under some other bash proves nothing, so fail if the runner is not what
      # the name says. The versions it prints are the evidence of what ran.
      - name: Check the toolchain is a stock Mac's
        run: |
          env PATH="$STOCK_PATH" /bin/bash -e <<'EOF'
          echo "bash $BASH_VERSION"
          case "$BASH_VERSION" in 3.2.*) ;; *) echo "::error::/bin/bash is $BASH_VERSION, not 3.2"; exit 1 ;; esac
          for t in awk sed grep python3 jq git; do
            command -v "$t" || { echo "::error::$t is not on a stock Mac path"; exit 1; }
          done
          python3 --version; jq --version; git --version
          EOF
      - name: Run the gate golden tests
        run: env PATH="$STOCK_PATH" /bin/bash tests/run.sh

  plugin-validate:
    name: plugin manifest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DISABLE_AUTOUPDATER: "1"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      # The npm postinstall below runs third-party code; keep the token out of .git/config.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      # Pinned: the validator's rules change between releases, and CI must not drift under us.
      # `plugin validate` reads files only; it needs no login and no secret.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.282
      - name: Validate the marketplace and the plugin (a warning fails the job)
        run: |
          claude plugin validate --strict .
          claude plugin validate --strict ./.claude
